
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간업무 관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#ffffff;
  --bg-sub:#f8f8f6;
  --bg-hover:#f1f1ef;
  --text:#2f2c28;
  --text-mid:#5f5b55;
  --text-mute:#95918a;
  --line:#e8e7e3;
  --line-strong:#d6d4cf;
  --ink:#2c5a7a;
  --ink-soft:#eaf1f6;
  --amber:#b1741a;
  --amber-soft:#fbf2e3;
  --moss:#3d7355;
  --moss-soft:#e9f2ec;
  --rose:#a8453f;
  --rose-soft:#fbeceb;
  --radius:7px;
  --sidebar:252px;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--ink);text-decoration:none}
::selection{background:#d9e6ef}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* ---------- 로그인 ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-art{
  background:var(--bg-sub);border-right:1px solid var(--line);
  padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.auth-art h1{font-size:38px;line-height:1.25;letter-spacing:-.035em;font-weight:800;margin:36px 0 14px}
.auth-art h1 em{font-style:normal;color:var(--ink)}
.auth-art p{color:var(--text-mid);max-width:34ch}

/* 시그니처: 수요일 주기 스파인 */
.spine{margin-top:44px}
.spine-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute);margin-bottom:14px;font-weight:600}
.spine-rail{position:relative;height:64px}
.spine-rail:before{content:"";position:absolute;left:0;right:0;top:14px;height:1px;background:var(--line-strong)}
.spine-node{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:56px}
.spine-dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);margin:10px auto 0}
.spine-node.on .spine-dot{background:var(--ink);box-shadow:0 0 0 4px var(--ink-soft)}
.spine-node small{display:block;margin-top:8px;font-size:11px;color:var(--text-mute)}
.spine-node.on small{color:var(--ink);font-weight:700}
.auth-foot{font-size:12px;color:var(--text-mute)}

.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px}
.auth-card{width:100%;max-width:352px}
.auth-card h2{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.auth-card .sub{color:var(--text-mute);margin-bottom:26px;font-size:13px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius);
  background:var(--bg);transition:border-color .12s,box-shadow .12s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)
}
.field textarea{resize:vertical;min-height:78px;line-height:1.65}
.field .hint{font-size:11.5px;color:var(--text-mute);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{padding:9px 15px;border-radius:var(--radius);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:.12s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#24506c}
.btn-ghost{border-color:var(--line-strong);background:var(--bg)}
.btn-ghost:hover{background:var(--bg-hover)}
.btn-danger{color:var(--rose);border-color:#e7c9c7;background:var(--bg)}
.btn-danger:hover{background:var(--rose-soft)}
.btn-block{width:100%;display:block;padding:11px}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.switch-line{text-align:center;margin-top:18px;font-size:13px;color:var(--text-mute)}
.switch-line button{color:var(--ink);font-weight:600}
.alert{padding:9px 12px;border-radius:var(--radius);font-size:12.5px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert.err{background:var(--rose-soft);color:var(--rose)}
.alert.ok{background:var(--moss-soft);color:var(--moss)}

/* ---------- 앱 셸 ---------- */
.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:var(--sidebar) 1fr}
.side{
  background:var(--bg-sub);border-right:1px solid var(--line);
  padding:16px 12px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.side-user{padding:8px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side-user .nm{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.side-user .meta{font-size:11.5px;color:var(--text-mute);margin-top:3px}
.nav-group{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-mute);font-weight:700;padding:14px 10px 5px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;
  color:var(--text-mid);font-size:13.5px;font-weight:500;text-align:left;width:100%;
}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.on{background:#eceae6;color:var(--text);font-weight:600}
.nav-item .ic{width:16px;text-align:center;opacity:.75;font-size:13px}
.nav-badge{margin-left:auto;font-size:11px;background:var(--ink);color:#fff;border-radius:20px;padding:0 6px;font-weight:700}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  padding:20px 34px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.page-title{font-size:25px;font-weight:800;letter-spacing:-.03em}
.page-desc{color:var(--text-mute);font-size:13px;margin-top:3px}
.content{padding:22px 34px 70px;max-width:1240px}

/* ---------- 공통 요소 ---------- */
.card{border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card-b{padding:16px}
.card+.card{margin-top:18px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:20px}
.stat{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:var(--bg)}
.stat .k{font-size:11.5px;color:var(--text-mute);font-weight:600;letter-spacing:.02em}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.stat .v small{font-size:13px;font-weight:600;color:var(--text-mute);letter-spacing:0}
.stat .d{font-size:11.5px;color:var(--text-mute);margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute);
  font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg-sub)
}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg-sub)}
tbody tr:last-child td{border-bottom:none}
.t-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.t-wrap table{font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag-ink{background:var(--ink-soft);color:var(--ink)}
.tag-moss{background:var(--moss-soft);color:var(--moss)}
.tag-amber{background:var(--amber-soft);color:var(--amber)}
.tag-rose{background:var(--rose-soft);color:var(--rose)}
.tag-grey{background:var(--bg-hover);color:var(--text-mid)}

.bar{height:5px;border-radius:5px;background:var(--bg-hover);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .3s}
.bar.done i{background:var(--moss)}

.empty{text-align:center;padding:44px 20px;color:var(--text-mute)}
.empty .big{font-size:15px;color:var(--text-mid);font-weight:600;margin-bottom:5px}

.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--bg)}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--text-mid);border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- 노션풍 입력 리스트 ---------- */
.nlist{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.nrow{border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:none}
.nhead{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;transition:background .1s}
.nhead:hover{background:var(--bg-sub)}
.ncaret{color:var(--text-mute);font-size:10px;width:12px;transition:transform .15s;flex-shrink:0}
.nrow.open .ncaret{transform:rotate(90deg)}
.ntitle{font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nsub{font-size:11.5px;color:var(--text-mute);margin-left:auto;display:flex;align-items:center;gap:9px;flex-shrink:0}
.nbody{display:none;padding:4px 14px 16px 37px;background:var(--bg-sub);border-top:1px solid var(--line)}
.nrow.open .nbody{display:block}
.nbody .row2{gap:14px}
.divider{height:1px;background:var(--line);margin:16px 0}

.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--bg-hover);color:var(--text-mid);font-family:var(--mono)}
.pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65}
.mute{color:var(--text-mute)}
.small{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.flexc{display:flex;align-items:center;gap:8px}

/* ---------- 모달 ---------- */
.mask{position:fixed;inset:0;background:rgba(30,28,25,.42);display:none;align-items:center;justify-content:center;padding:22px;z-index:60}
.mask.on{display:flex}
.modal{background:var(--bg);border-radius:11px;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.modal-h{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--bg-sub);border-radius:0 0 11px 11px}
.x{font-size:19px;color:var(--text-mute);line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{background:var(--bg-hover)}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;
  opacity:0;transition:.25s;z-index:90;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.22)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.report-doc{font-size:13.5px;line-height:1.8}
.report-doc h2{font-size:19px;letter-spacing:-.02em;margin:0 0 4px}
.report-doc h3{font-size:15px;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--text);letter-spacing:-.01em}
.report-doc h4{font-size:13.5px;margin:14px 0 4px;color:var(--ink)}
.report-doc ul{margin:0 0 4px 18px}
.report-doc li{margin-bottom:2px}
.report-meta{color:var(--text-mute);font-size:12px;margin-bottom:8px}

@media print{
  .side,.topbar,.no-print{display:none!important}
  .app.on{display:block}
  .content{padding:0;max-width:none}
  .card{border:none}
}
@media (max-width:900px){
  .auth-wrap{grid-template-columns:1fr}
  .auth-art{display:none}
  .app.on{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px;padding:10px}
  .side-user,.nav-group,.side-foot{width:100%}
  .nav-item{width:auto}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ===== 로그인 / 가입 ===== -->
<div class="auth-wrap" id="authView">
  <div class="auth-art">
    <div>
      <div class="brand"><span class="brand-mark">주</span> 주간업무 관리</div>
      <h1>수요일마다,<br><em>한 장으로 정리되는</em><br>우리 팀의 한 주.</h1>
      <p>프로젝트별로 여러 담당자가 각자 진행사항을 올리면, 관리자 화면에서 자동으로 취합됩니다.</p>
      <div class="spine">
        <div class="spine-label">Weekly cadence</div>
        <div class="spine-rail" id="spineRail"></div>
      </div>
    </div>
    <div class="auth-foot">데이터는 이 브라우저에 저장됩니다 · 비밀번호는 SHA-256으로 해시 처리</div>
  </div>

  <div class="auth-panel">
    <!-- 로그인 -->
    <div class="auth-card" id="loginCard">
      <h2>로그인</h2>
      <p class="sub">사번과 비밀번호를 입력하세요.</p>
      <div class="alert err" id="loginAlert"></div>
      <div class="field"><label for="li_emp">사번</label><input id="li_emp" autocomplete="username" placeholder="예: 20240115"></div>
      <div class="field"><label for="li_pw">비밀번호</label><input id="li_pw" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
      <button class="btn btn-primary btn-block" id="btnLogin">로그인</button>
      <div class="switch-line">계정이 없으신가요? <button id="toSignup">가입하기</button></div>
      <div class="switch-line small" style="margin-top:10px">최초 관리자 계정 — 사번 <b>admin</b> / 비밀번호 <b>admin1234</b></div>
    </div>

    <!-- 가입 -->
    <div class="auth-card" id="signupCard" style="display:none">
      <h2>가입하기</h2>
      <p class="sub">가입 후 바로 주간업무를 작성할 수 있습니다.</p>
      <div class="alert err" id="suAlert"></div>
      <div class="field"><label for="su_name">이름</label><input id="su_name" placeholder="홍길동"></div>
      <div class="field"><label for="su_emp">사번</label><input id="su_emp" placeholder="20240115"><div class="hint">로그인 아이디로 사용됩니다.</div></div>
      <div class="field"><label for="su_team">팀명</label><input id="su_team" placeholder="플랫폼개발팀" list="teamList"><datalist id="teamList"></datalist></div>
      <div class="row2">
        <div class="field"><label for="su_pw">비밀번호</label><input id="su_pw" type="password" placeholder="6자 이상"></div>
        <div class="field"><label for="su_pw2">비밀번호 확인</label><input id="su_pw2" type="password" placeholder="다시 입력"></div>
      </div>
      <button class="btn btn-primary btn-block" id="btnSignup">가입하기</button>
      <div class="switch-line">이미 계정이 있으신가요? <button id="toLogin">로그인</button></div>
    </div>
  </div>
</div>

<!-- ===== 앱 ===== -->
<div class="app" id="appView">
  <aside class="side">
    <div class="side-user">
      <div class="nm"><span class="brand-mark" style="width:22px;height:22px;font-size:11px">주</span><span id="sbName"></span></div>
      <div class="meta" id="sbMeta"></div>
    </div>
    <div id="navBox"></div>
    <div class="side-foot">
      <button class="nav-item" id="btnLogout"><span class="ic">↩</span> 로그아웃</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><div class="page-title" id="pgTitle"></div><div class="page-desc" id="pgDesc"></div></div>
      <div class="btn-row no-print" id="pgActions"></div>
    </div>
    <div class="content" id="pgBody"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="modal-h"><h3 id="mTitle"></h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="modal-b" id="mBody"></div>
  <div class="modal-f" id="mFoot"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   주간업무 관리 — 단일 파일 앱
   저장소: localStorage (교체 지점은 Store 객체 한 곳)
   ========================================================= */
'use strict';

/* ---------- 기본 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2 = s => esc(s).replace(/\n/g, '<br>');

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- 날짜 / 주차 ---------- */
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
function fmtD(s, withDay) {
  if (!s) return '-';
  const d = parseD(s);
  return `${d.getMonth() + 1}/${d.getDate()}` + (withDay ? `(${DAYS[d.getDay()]})` : '');
}
const fmtFull = s => s ? s.replace(/-/g, '.') : '-';
function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
/** 해당 날짜가 속한 주(월~일)의 수요일 */
function wedOf(date) {
  const d = new Date(date); d.setHours(0, 0, 0, 0);
  const off = (d.getDay() + 6) % 7;            // 월=0
  d.setDate(d.getDate() - off + 2);            // 수요일
  return d;
}
function isoWeekNo(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dn = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dn);
  const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return { year: d.getUTCFullYear(), week: Math.ceil(((d - ys) / 864e5 + 1) / 7) };
}
function weekInfo(date) {
  const wed = wedOf(date);
  const { year, week } = isoWeekNo(wed);
  const mon = new Date(wed); mon.setDate(wed.getDate() - 2);
  const sun = new Date(wed); sun.setDate(wed.getDate() + 4);
  return { key: `${year}-W${String(week).padStart(2, '0')}`, year, week, wed: iso(wed), start: iso(mon), end: iso(sun) };
}
const curWeek = () => weekInfo(new Date());
/** 최근/향후 주차 목록 (기준일 포함, 과거 back주 ~ 미래 fwd주) */
function weekOptions(back = 16, fwd = 2) {
  const out = []; const base = wedOf(new Date());
  for (let i = fwd; i >= -back; i--) {
    const d = new Date(base); d.setDate(base.getDate() + i * 7);
    out.push(weekInfo(d));
  }
  return out;
}
const weekLabel = w => `${w.year}년 ${w.week}주차 · ${fmtD(w.start)}~${fmtD(w.end)}`;
const weekShort = w => `${String(w.year).slice(2)}년 ${w.week}주차`;
function dday(dueStr) {
  if (!dueStr) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((parseD(dueStr) - t) / 864e5);
}

/* ---------- 비밀번호 해시 (SHA-256 + 개인 솔트) ---------- */
const salt = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');
async function hashPw(pw, s) {
  const data = new TextEncoder().encode(s + '::' + pw);
  if (crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  // http/file 환경 폴백 (GitHub Pages는 https이므로 위 경로 사용)
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (const b of data) { h1 = (h1 ^ b) * 16777619 >>> 0; h2 = (h2 + b * 31 ^ h1) >>> 0; }
  return 'fb' + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

/* =========================================================
   Store — 저장소 어댑터
   Supabase/Firebase 등으로 옮길 때 이 객체만 교체하면 됩니다.
   ========================================================= */
const KEY = 'weekly_report_db_v1';
const Store = {
  db: null,
  blank() { return { users: [], projects: [], reports: [], meta: { created: Date.now() } }; },
  load() {
    try { this.db = JSON.parse(localStorage.getItem(KEY)) || this.blank(); }
    catch { this.db = this.blank(); }
    for (const k of ['users', 'projects', 'reports']) if (!Array.isArray(this.db[k])) this.db[k] = [];
    if (!this.db.meta) this.db.meta = {};
    return this.db;
  },
  save() { localStorage.setItem(KEY, JSON.stringify(this.db)); },
  reset() { localStorage.removeItem(KEY); }
};
const DB = () => Store.db;

/* ---------- 세션 ---------- */

let ME = null;
const setSession = id => sessionStorage.setItem(SKEY, id);
const clearSession = () => sessionStorage.removeItem(SKEY);

const projName = id => (projById(id) || {}).name || '(삭제된 프로젝트)';
const activeProjects = () => DB().projects.filter(p => p.status !== '완료' && p.status !== '보류');
const reportsOfWeek = wk => DB().reports.filter(r => r.week === wk);

const PSTATUS = ['진행중', '준비', '보류', '완료'];
const statusTag = s => {
  const m = { '진행중': 'tag-ink', '준비': 'tag-grey', '보류': 'tag-amber', '완료': 'tag-moss' };
  return `<span class="tag ${m[s] || 'tag-grey'}">${esc(s)}</span>`;
};
function ddayTag(due, status) {
  if (status === '완료') return '<span class="tag tag-moss">완료</span>';
  const d = dday(due);
  if (d === null) return '';
  if (d < 0) return `<span class="tag tag-rose">지연 ${-d}일</span>`;
  if (d <= 7) return `<span class="tag tag-amber">D-${d}</span>`;
  return `<span class="tag tag-grey">D-${d}</span>`;
}

      id: uid(), name: '시스템 관리자', empNo: 'admin', team: '관리', role: 'admin',
      salt: s, pw: await hashPw('admin1234', s), createdAt: Date.now()
    });
    Store.save();
  }

  refreshTeamList();

  const u = sid && userById(sid);
  if (u) { ME = u; enterApp(); }
}

function drawSpine() {
  const rail = $('#spineRail'); if (!rail) return;
  const base = wedOf(new Date()); let html = '';
  for (let i = -2; i <= 2; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i * 7);
    const w = weekInfo(d);
    const left = ((i + 2) / 4) * 100;
    html += `<div class="spine-node ${i === 0 ? 'on' : ''}" style="left:${left}%">
      <div class="spine-dot"></div><small>${w.week}주<br>${fmtD(w.wed)}</small></div>`;
  }
  rail.innerHTML = html;
}
function refreshTeamList() {
  const teams = [...new Set(DB().users.map(u => u.team).filter(Boolean))];
  $('#teamList').innerHTML = teams.map(t => `<option value="${esc(t)}">`).join('');
}

function bindWeekSel() {
  const s = $('#selWeek'); if (s) s.onchange = () => { INPUT_WEEK = s.value; go('my-input'); };
}
function readRow(row) {
  const g = f => { const el = row.querySelector(`[data-f="${f}"]`); return el ? el.value.trim() : ''; };
  const pr = g('progress');
  return { thisWeek: g('thisWeek'), nextWeek: g('nextWeek'), issue: g('issue'), progress: pr === '' ? null : Math.max(0, Math.min(100, +pr)) };
}
function upsert(projectId, v) {
  let r = DB().reports.find(x => x.week === INPUT_WEEK && x.projectId === projectId && x.userId === ME.id);
  if (!r) {
    r = { id: uid(), week: INPUT_WEEK, projectId, userId: ME.id, createdAt: Date.now() };
    DB().reports.push(r);
  }
  Object.assign(r, v, { updatedAt: Date.now() });
  return r;
}
function saveOne(projectId, btn) {
  const row = btn.closest('.nrow'); const v = readRow(row);
  if (!v.thisWeek || !v.nextWeek) return toast('금주 진행사항과 차주 진행계획을 모두 입력하세요.');
  upsert(projectId, v); Store.save(); toast('저장되었습니다.'); go('my-input');
}
function saveAllInputs() {
  let n = 0, skip = 0;
  $$('#inputList .nrow').forEach(row => {
    const v = readRow(row);
    if (!v.thisWeek && !v.nextWeek) return;
    if (!v.thisWeek || !v.nextWeek) { skip++; return; }
    upsert(row.dataset.proj, v); n++;
  });
  Store.save();
  toast(n ? `${n}건 저장${skip ? ` · ${skip}건은 항목 누락으로 제외` : ''}` : '저장할 내용이 없습니다.');
  go('my-input');
}
function copyPrevInto(projectId, btn) {
  const wks = weekOptions(12, 1); const i = wks.findIndex(w => w.key === INPUT_WEEK);
  const prev = wks[i + 1];
  if (!prev) return toast('이전 주차 정보가 없습니다.');
  const r = DB().reports.find(x => x.week === prev.key && x.projectId === projectId && x.userId === ME.id);
  if (!r || !r.nextWeek) return toast('지난주에 작성한 차주 계획이 없습니다.');
  btn.closest('.nrow').querySelector('[data-f="thisWeek"]').value = r.nextWeek;
  toast('지난주 차주 계획을 금주 진행사항에 넣었습니다. 내용을 다듬어 저장하세요.');
}
function delReport(id) {
  const r = DB().reports.find(x => x.id === id); if (!r) return;
  if (!isAdmin() && r.userId !== ME.id) return toast('본인이 작성한 항목만 삭제할 수 있습니다.');
  if (!confirm('이 진행사항을 삭제할까요? 되돌릴 수 없습니다.')) return;
  DB().reports = DB().reports.filter(x => x.id !== id); Store.save();
  toast('삭제되었습니다.'); go(PAGE);
}
function editReport(id) {
  const r = DB().reports.find(x => x.id === id); if (!r) return;
  if (!isAdmin() && r.userId !== ME.id) return toast('본인이 작성한 항목만 수정할 수 있습니다.');

    <div class="row2">
      <div class="field"><label>진척률 (%)</label><input type="number" min="0" max="100" id="e_pg" value="${r.progress ?? ''}"></div>
      <div class="field"><label>이슈 / 협조 요청</label><input id="e_is" value="${esc(r.issue || '')}"></div>
    </div>`,

function saveEdit(id) {

function exportMyCsv() { downloadCsv(myReports(), `내주간업무_${ME.name}.csv`); }

function downloadCsv(rows, filename) {
  if (!rows.length) return toast('내보낼 데이터가 없습니다.');
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['주차', '기준수요일', '프로젝트코드', '프로젝트명', '완료예정일', '팀', '작성자', '금주진행사항', '차주진행계획', '진척률', '이슈', '최종수정'];
  const body = rows.map(r => {
    const p = projById(r.projectId) || {}, u = userById(r.userId) || {};
    const w = weekOptions(120, 8).find(x => x.key === r.week);
    return [r.week, w ? w.wed : '', p.code || '', p.name || '', p.dueDate || '', u.team || '', u.name || '',
    r.thisWeek, r.nextWeek, r.progress ?? '', r.issue || '', fmtTime(r.updatedAt)].map(q).join(',');
  });
  const blob = new Blob(['\uFEFF' + head.map(q).join(',') + '\n' + body.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href); toast('CSV 파일을 내려받았습니다.');
}

    startDate: $('#p_start').value, dueDate: $('#p_due').value,

  };

  if (v.startDate && v.dueDate < v.startDate) return bad('완료 예정일이 시작일보다 빠릅니다.');

function delProj(id) {
  const n = DB().reports.filter(r => r.projectId === id).length;
  if (!confirm(`프로젝트를 삭제할까요?${n ? `\n연결된 주간업무 ${n}건도 함께 삭제됩니다.` : ''}`)) return;
  DB().projects = DB().projects.filter(p => p.id !== id);
  DB().reports = DB().reports.filter(r => r.projectId !== id);
  Store.save(); toast('삭제되었습니다.'); go('ref-proj');
}
function exportProjCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['코드', '프로젝트명', '주관팀', 'PM', '상태', '시작일', '완료예정일', '설명'];
  const body = DB().projects.map(p => [p.code, p.name, p.team, p.owner, p.status, p.startDate, p.dueDate, p.desc].map(q).join(','));
  const blob = new Blob(['\uFEFF' + head.map(q).join(',') + '\n' + body.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '프로젝트목록.csv'; a.click();
  URL.revokeObjectURL(a.href); toast('CSV 파일을 내려받았습니다.');
}

function saveAcc() {

}
async function changePw() {
  const o = $('#a_old').value, n = $('#a_new').value, n2 = $('#a_new2').value;
  if (await hashPw(o, ME.salt) !== ME.pw) return showAlert('#pwAlert', '현재 비밀번호가 일치하지 않습니다.');
  if (n.length < 6) return showAlert('#pwAlert', '새 비밀번호는 6자 이상이어야 합니다.');
  if (n !== n2) return showAlert('#pwAlert', '새 비밀번호 확인이 일치하지 않습니다.');
  ME.salt = salt(); ME.pw = await hashPw(n, ME.salt); Store.save();
  showAlert('#pwAlert', ''); ['#a_old', '#a_new', '#a_new2'].forEach(i => $(i).value = '');

let ADR = { week: null, by: 'proj', showIssue: true, showOwner: true, onlyActive: false };
PAGES['adm-report'] = () => {
  if (!guard()) return;
  if (!ADR.week) ADR.week = curWeek().key;

           <button class="btn btn-ghost" onclick="downloadCsv(reportsOfWeek(ADR.week),'주간보고_${ADR.week}.csv')">CSV</button>
           <button class="btn btn-primary" onclick="window.print()">인쇄 · PDF 저장</button>`);

  let h = `<div class="toolbar no-print">
    <select onchange="ADR.week=this.value;go('adm-report')">
      ${wks.map(x => `<option value="${x.key}" ${x.key === ADR.week ? 'selected' : ''}>${weekLabel(x)}</option>`).join('')}
    </select>
    <div class="seg">
      <button class="${ADR.by === 'proj' ? 'on' : ''}" onclick="ADR.by='proj';go('adm-report')">프로젝트 기준</button>
      <button class="${ADR.by === 'team' ? 'on' : ''}" onclick="ADR.by='team';go('adm-report')">팀 기준</button>
      <button class="${ADR.by === 'person' ? 'on' : ''}" onclick="ADR.by='person';go('adm-report')">개인 기준</button>
    </div>
    <label class="small flexc"><input type="checkbox" style="width:auto" ${ADR.showIssue ? 'checked' : ''} onchange="ADR.showIssue=this.checked;go('adm-report')"> 이슈 포함</label>
    <label class="small flexc"><input type="checkbox" style="width:auto" ${ADR.showOwner ? 'checked' : ''} onchange="ADR.showOwner=this.checked;go('adm-report')"> 작성자 표기</label>
  </div>`;

  h += `<div class="card"><div class="card-b"><div class="report-doc" id="reportDoc">${buildReportHtml()}</div></div></div>`;
  $('#pgBody').innerHTML = h;
};
function reportGroups() {
  const rows = reportsOfWeek(ADR.week);
  const g = {};
  for (const r of rows) {
    let k;
    if (ADR.by === 'proj') k = projName(r.projectId);
    else if (ADR.by === 'team') k = (userById(r.userId) || {}).team || '미지정';
    else k = userName(r.userId);
    (g[k] ||= []).push(r);
  }
  return Object.entries(g).sort((a, b) => a[0].localeCompare(b[0]));
}
function buildReportHtml() {
  const w = weekByKey(ADR.week);
  const rows = reportsOfWeek(ADR.week);
  if (!rows.length) return emptyBox('해당 주차에 취합할 내용이 없습니다', '');
  const groups = reportGroups();
  let h = `<h2>주간업무 보고</h2>
    <div class="report-meta">${weekLabel(w)} · 기준일 ${fmtFull(w.wed)}(수) · 작성 ${rows.length}건 · 참여 ${new Set(rows.map(r => r.userId)).size}명 · 출력 ${fmtFull(iso(new Date()))}</div>`;
  for (const [name, list] of groups) {
    const p = ADR.by === 'proj' ? DB().projects.find(x => x.name === name) : null;
    h += `<h3>${esc(name)}${p ? ` <span class="chip">${esc(p.code)}</span>` : ''}</h3>`;
    if (p) h += `<div class="report-meta">상태 ${esc(p.status)} · 주관 ${esc(p.team || '-')} · PM ${esc(p.owner || '-')} · 완료 예정 ${fmtFull(p.dueDate)}${dday(p.dueDate) < 0 && p.status !== '완료' ? ` (지연 ${-dday(p.dueDate)}일)` : ''}</div>`;
    for (const r of list) {
      const label = ADR.by === 'proj' ? userName(r.userId) : projName(r.projectId);
      h += `<h4>${esc(ADR.showOwner || ADR.by !== 'proj' ? label : '진행사항')}${r.progress != null ? ` (${r.progress}%)` : ''}</h4>
        <ul><li><b>금주</b> ${nl2(r.thisWeek)}</li><li><b>차주</b> ${nl2(r.nextWeek)}</li>
        ${ADR.showIssue && r.issue ? `<li><b>이슈</b> ${nl2(r.issue)}</li>` : ''}</ul>`;
    }
  }
  return h;
}
function buildReportMd() {
  const w = weekByKey(ADR.week);
  const rows = reportsOfWeek(ADR.week);
  if (!rows.length) return '';
  let m = `# 주간업무 보고\n\n${weekLabel(w)} · 기준일 ${fmtFull(w.wed)}(수)\n작성 ${rows.length}건 · 참여 ${new Set(rows.map(r => r.userId)).size}명\n`;
  for (const [name, list] of reportGroups()) {
    const p = ADR.by === 'proj' ? DB().projects.find(x => x.name === name) : null;
    m += `\n## ${name}${p ? ` (${p.code})` : ''}\n`;
    if (p) m += `> 상태 ${p.status} · 주관 ${p.team || '-'} · PM ${p.owner || '-'} · 완료 예정 ${fmtFull(p.dueDate)}\n`;
    for (const r of list) {
      const label = ADR.by === 'proj' ? userName(r.userId) : projName(r.projectId);
      m += `\n### ${label}${r.progress != null ? ` (${r.progress}%)` : ''}\n`;
      m += `- **금주**: ${r.thisWeek.replace(/\n/g, ' / ')}\n- **차주**: ${r.nextWeek.replace(/\n/g, ' / ')}\n`;
      if (ADR.showIssue && r.issue) m += `- **이슈**: ${r.issue}\n`;
    }
  }
  return m;
}
async function copyMd() {
  const md = buildReportMd();
  if (!md) return toast('복사할 내용이 없습니다.');
  try { await navigator.clipboard.writeText(md); toast('마크다운을 클립보드에 복사했습니다.'); }
  catch {
    openModal('마크다운 복사', `<textarea style="width:100%;min-height:320px;font-family:var(--mono);font-size:12px">${esc(md)}</textarea>
      <div class="hint">직접 선택해서 복사하세요.</div>`);
  }
}

async function doAddUser() {
  const name = $('#nu_name').value.trim(), emp = $('#nu_emp').value.trim(),
    team = $('#nu_team').value.trim(), role = $('#nu_role').value, pw = $('#nu_pw').value;
  if (!name || !emp || !team) return showAlert('#auAlert', '이름·사번·팀명을 모두 입력하세요.');

        <button class="btn btn-primary btn-sm" onclick="exportJson()">전체 데이터 JSON 내보내기</button>
        <button class="btn btn-ghost btn-sm" onclick="$('#impFile').click()">JSON 가져오기</button>
        <button class="btn btn-ghost btn-sm" onclick="downloadCsv(DB().reports,'전체주간업무.csv')">전체 주간업무 CSV</button>
        <input type="file" id="impFile" accept=".json" style="display:none">
      </div>
      <div class="hint" style="margin-top:10px">가져오기를 실행하면 현재 데이터를 모두 덮어씁니다. 먼저 내보내기로 백업하세요.</div>
    </div></div>
    <div class="card"><div class="card-h"><h3>샘플 데이터</h3></div><div class="card-b">
      <p class="small mute" style="margin-bottom:10px">기능을 둘러보기 위한 예시 프로젝트와 주간업무를 넣습니다. 기존 데이터는 유지됩니다.</p>
      <button class="btn btn-ghost btn-sm" onclick="seedDemo()">샘플 데이터 넣기</button>
    </div></div>
    <div class="card"><div class="card-h"><h3>초기화</h3></div><div class="card-b">
      <p class="small mute" style="margin-bottom:10px">모든 사용자·프로젝트·주간업무를 삭제하고 초기 관리자 계정만 남깁니다.</p>
      <button class="btn btn-danger btn-sm" onclick="wipeAll()">전체 데이터 삭제</button>
    </div></div>`;
  $('#impFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        if (!j.users || !j.projects || !j.reports) throw 0;
        if (!confirm('현재 데이터를 모두 덮어씁니다. 계속할까요?')) return;
        Store.db = j; Store.save(); clearSession();
        alert('가져오기가 완료되었습니다. 다시 로그인해 주세요.');
        location.reload();
      } catch { toast('올바른 백업 파일이 아닙니다.'); }
    };
    rd.readAsText(f);
  };
};
function exportJson() {
  const blob = new Blob([JSON.stringify(DB(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `주간업무백업_${iso(new Date())}.json`; a.click();
  URL.revokeObjectURL(a.href); toast('백업 파일을 내려받았습니다.');
}
function wipeAll() {
  if (!confirm('정말 모든 데이터를 삭제할까요? 되돌릴 수 없습니다.')) return;
  if (!confirm('마지막 확인입니다. 백업은 받으셨나요?')) return;
  Store.reset(); clearSession(); location.reload();
}
async function seedDemo() {
  const d = DB();
  const t = new Date();
  const plus = n => { const x = new Date(t); x.setDate(x.getDate() + n); return iso(x); };
  const demoP = [
    { code: 'PRJ-01', name: '차세대 그룹웨어 구축', team: '플랫폼개발팀', owner: '김도현', status: '진행중', startDate: plus(-70), dueDate: plus(45) },
    { code: 'PRJ-02', name: 'ERP 고도화 2차', team: '경영정보팀', owner: '박서연', status: '진행중', startDate: plus(-120), dueDate: plus(-5) },
    { code: 'PRJ-03', name: '데이터 표준화 체계 수립', team: '데이터팀', owner: '이준호', status: '준비', startDate: plus(-10), dueDate: plus(120) }
  ];
  const ids = [];
  for (const p of demoP) {
    if (d.projects.some(x => x.code === p.code)) { ids.push(d.projects.find(x => x.code === p.code).id); continue; }
    const id = uid(); d.projects.push({ id, ...p, desc: '', createdAt: Date.now(), updatedAt: Date.now() }); ids.push(id);
  }
  const names = [['최민서', '20250101', '플랫폼개발팀'], ['정하늘', '20250102', '데이터팀']];
  const uids = [];
  for (const [n, e, tm] of names) {
    let u = d.users.find(x => x.empNo === e);
    if (!u) { const s = salt(); u = { id: uid(), name: n, empNo: e, team: tm, role: 'user', salt: s, pw: await hashPw('test1234', s), createdAt: Date.now() }; d.users.push(u); }
    uids.push(u.id);
  }
  const wk = curWeek().key;
  const samples = [
    [ids[0], uids[0], '로그인/SSO 모듈 개발 완료, 통합 테스트 1차 수행', '권한 관리 화면 개발 착수, QA 이슈 대응', 45, ''],
    [ids[0], ME.id, '요구사항 정의서 v2 검토 및 확정', '설계 산출물 리뷰 회의 주관', 40, ''],
    [ids[1], uids[1], '재무 모듈 마이그레이션 스크립트 검증', '운영 이관 리허설 진행', 80, '검수 인력 1명 추가 필요']
  ];
  for (const [pid, u, tw, nw, pg, is] of samples) {
    if (d.reports.some(r => r.week === wk && r.projectId === pid && r.userId === u)) continue;
    d.reports.push({ id: uid(), week: wk, projectId: pid, userId: u, thisWeek: tw, nextWeek: nw, progress: pg, issue: is, createdAt: Date.now(), updatedAt: Date.now() });
  }
  Store.save(); toast('샘플 데이터를 넣었습니다. (테스트 계정 비밀번호: test1234)'); go('adm-data');
}

/* ---------- 시작 ---------- */
boot();

</script>
</body>
</html>
